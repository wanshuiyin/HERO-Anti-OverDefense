name: Goal Pulse

on:
  push:
    branches: [main]
    paths: ['skills/goal-pulse/**', 'tests/test_goal_pulse.py', '.github/workflows/goal-pulse.yml']
  pull_request:
    paths: ['skills/goal-pulse/**', 'tests/test_goal_pulse.py', '.github/workflows/goal-pulse.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r skills/goal-pulse/requirements.txt
      - run: python -m unittest discover -s tests -p test_goal_pulse.py -v
